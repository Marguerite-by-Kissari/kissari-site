name: Kissari - Controle et publication Pages
on:
  push:
    branches: [main, 'atelier/**']
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: kissari-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Valider les reglages
        run: python3 scripts/test-editorial-config.py
      - name: Verifier JavaScript
        run: |
          node --check static/atelier-article/app.js
          node --check static/atelier-article/editorial.js
          node --check static/atelier-article/publication-ui.js
      - name: Configurer Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Construire sans brouillons ni futurs
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo --minify --baseURL "${PAGES_URL:-https://example.invalid}/"
          python3 scripts/check-navigation-recette.py public
          python3 - <<'PY'
          import json,os,shutil
          from pathlib import Path
          shutil.rmtree('public/atelier-article',ignore_errors=True)
          Path('public/deployment.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA']}))
          PY
      - name: Ecarter une revision main depassee
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/main'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response: sha=json.load(response)['object']['sha']
          if sha!=os.environ['GITHUB_SHA']:raise SystemExit('Revision depassee : aucun deploiement.')
          PY
      - name: Preparer artefact Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer sur Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
