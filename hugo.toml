baseURL = 'https://kissari.com/'
languageCode = 'fr-be'
defaultContentLanguage = 'fr'
title = 'KISSARI'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = 'KISSARI — Le nouveau site arrive bientôt.'
  author = 'KISSARI'

[languages]
  [languages.fr]
    languageName = 'Français'
    weight = 1
    title = 'KISSARI'
    contentDir = 'content'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menus]
  [[menus.main]]
    name = 'KISSARI'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Nos offres'
    pageRef = '/offres'
    weight = 20
  [[menus.main]]
    name = 'Nos projets'
    pageRef = '/projets'
    weight = 30
  [[menus.main]]
    name = 'Le blog'
    pageRef = '/blog'
    weight = 40
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 50
  [[menus.main]]
    name = 'Presse'
    pageRef = '/presse'
    weight = 60
